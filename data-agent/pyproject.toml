[project]
name = "data-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "asyncmy==0.2.11",
    "cryptography==46.0.4",
    "elasticsearch[async]>=8,<9",
    "fastapi[standard]==0.128.0",
    "FlagEmbedding==1.4.0",
    "huggingface-hub==0.36.0",
    "httpx==0.28.1",
    "jieba==0.42.1",
    "langchain==1.2.7",
    "langchain-deepseek==1.0.1",
    "langchain-huggingface==1.2.1",
    "langchain-openai==1.3.2",
    "langgraph==1.0.7",
    "loguru==0.7.3",
    "omegaconf==2.3.0",
    "psutil>=7,<8",
    "python-dotenv>=1.0.0",
    "qdrant-client==1.16.2",
    "redis>=5,<7",
    "sqlalchemy==2.0.46",
    "sqlglot>=26.0.0",
]

[project.scripts]
data-agent-memory-worker = "app.bootstrap.worker:main"

[project.optional-dependencies]
observability = [
    "arize-phoenix-client>=3.2.0",
    "arize-phoenix-otel>=0.17.1",
    "openinference-instrumentation-langchain>=0.1.70",
    "openinference-semantic-conventions>=0.1.32",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]
